name: ai_nexus
description: Nexus AI - Next Generation AI Finance Companion
publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  web_socket_channel: ^3.0.0

  # Local Database (Offline-First)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Preferences
  shared_preferences: ^2.2.3

  # Auth & Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  jwt_decoder: ^2.0.1

  # UI Components
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  lucide_icons: ^0.257.0

  # Utilities
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5

  # Background Work
  workmanager: ^0.6.0
  flutter_local_notifications: ^17.2.1+1

  # Audio (for AI Coach voice)
  record: ^6.0.0
  just_audio: ^0.9.38
  speech_to_text: ^7.0.0
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  # Pure-Dart image codec/resize (isolate-safe). Used by image_pipeline
  # to compress + thumbnail uploads for the InsightAI vision endpoints
  # without blocking the UI thread.
  image: ^4.3.0
  google_mlkit_text_recognition: ^0.15.1
  flutter_tts: ^4.2.5
  crypto: ^3.0.7

  # Google Drive Integration
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.0

  # File Picking
  file_picker: ^8.1.4
  pdfx: ^2.9.2
  timezone: ^0.9.4
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  go_router_builder: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/

  # Plus Jakarta Sans is loaded via google_fonts package at runtime
